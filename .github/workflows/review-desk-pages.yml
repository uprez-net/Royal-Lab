name: Review desk site

# Publishes only site/review-desk (static HTML, CSS and JS with no content,
# answers or credentials) to GitHub Pages. Task content and reviewer answers
# stay in private Vercel Blob behind personal invite links.
on:
  push:
    branches: [main]
    paths:
      - 'site/review-desk/**'
      - '.github/workflows/review-desk-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: review-desk-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/review-desk
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
